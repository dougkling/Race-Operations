name: Validate
on:
  push:
    branches: [main, 'feature/**', 'development/**']
  pull_request:
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: python tools/validate.py
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: node tests/test_dashboard_browser.js
      - run: python tools/build_packages.py --output dist
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Parse Windows deployment scripts without executing them
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Get-ChildItem cloud,dvr -Filter '*.ps1' -Recurse | ForEach-Object {
            $tokens=$null; $errors=$null
            [void][Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)
            if($errors.Count){throw "PowerShell parse failed: $($_.FullName): $errors"}
          }
